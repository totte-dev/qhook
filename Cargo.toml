[package]
name = "qhook"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Lightweight event gateway with queue and retry. SQS for webhooks and events."
license = "Apache-2.0"
repository = "https://github.com/totte-dev/qhook"
homepage = "https://totte-dev.github.io/qhook/"
documentation = "https://totte-dev.github.io/qhook/"
readme = "README.md"
keywords = ["webhook", "event-gateway", "queue", "retry", "cloudevents"]
categories = ["web-programming", "asynchronous", "network-programming"]
exclude = [
    "tests/",
    "examples/",
    "docs/",
    ".github/",
    ".claude/",
    ".devcontainer/",
    ".dockerignore",
    "docker-compose*.yaml",
    "Dockerfile",
    "KANBAN.md",
    "CLAUDE.md",
    "renovate.json",
    "CHANGELOG.md",
]

[dependencies]
# Web
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }

# DB
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "chrono"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Crypto
hmac = "0.12"
sha2 = { version = "0.10", features = ["oid"] }
hex = "0.4"
base64 = "0.22"
subtle = "2"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
pkcs1 = "0.7"
x509-parser = "0.18"

# CLI
clap = { version = "4", features = ["derive"] }

# gRPC
tonic = { version = "0.14", default-features = false, features = ["transport", "prost", "channel"] }
http = "1"
prost = "0.14"

# Utilities
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
