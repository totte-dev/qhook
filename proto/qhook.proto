syntax = "proto3";

package qhook.v1;

// EventReceiver is the gRPC service that qhook calls to deliver events.
// Implement this service in your application to receive events via gRPC.
service EventReceiver {
  // Deliver sends a single event to the handler.
  rpc Deliver(DeliverRequest) returns (DeliverResponse);
}

message DeliverRequest {
  string event_id = 1;
  string event_type = 2;
  string handler = 3;
  string payload = 4;          // JSON payload (original or transformed)
  map<string, string> metadata = 5; // CloudEvents headers and qhook metadata
  int32 attempt = 6;           // Current attempt number (1-based)
}

message DeliverResponse {
  bool success = 1;
  string message = 2;         // Optional error/status message
}
