openapi: 3.1.0
info:
  title: qhook API
  description: |
    Lightweight event gateway with Push and Pull delivery, built-in queue, retry, and workflow engine.

    qhook receives webhooks and events via HTTP, then delivers them via push
    (HTTP handlers) or pull (queue polling with ack/nack), with retry and
    dead-letter support.

    All responses include an `X-API-Version` header indicating the current API version.
  version: 0.5.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    url: https://github.com/totte-dev/qhook

servers:
  - url: "{scheme}://{host}:{port}"
    description: qhook server
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost
      port:
        default: "8888"

tags:
  - name: Ingest
    description: Event ingestion endpoints
  - name: Callback
    description: Workflow callback endpoint
  - name: Management
    description: Event and job inspection endpoints
  - name: Outbound
    description: Outbound webhook endpoint and subscription management
  - name: Queues
    description: Pull-mode queue endpoints (receive, ack, nack)
  - name: Operations
    description: Health check and metrics

paths:
  /webhooks/{source}:
    post:
      tags: [Ingest]
      summary: Receive a webhook
      description: |
        Receives a webhook payload from an external provider (e.g. GitHub, Stripe, Shopify).
        Signature verification is performed if configured for the source.

        **Event type extraction order:**
        1. `ce-type` header (CloudEvents binary mode)
        2. `type` field in JSON body (CloudEvents structured mode)
        3. Provider-specific logic (Stripe `$.type`, GitHub `$.action`, Shopify `$.topic`)
        4. Fallback: `"event"`
      security: []
      operationId: receiveWebhook
      parameters:
        - $ref: "#/components/parameters/source"
        - name: X-Hub-Signature-256
          in: header
          description: GitHub HMAC-SHA256 signature
          schema:
            type: string
            example: sha256=abc123...
        - name: Stripe-Signature
          in: header
          description: Stripe signature with timestamp
          schema:
            type: string
            example: t=1234567890,v1=abc123...
        - name: X-Shopify-Hmac-SHA256
          in: header
          description: Shopify Base64-encoded HMAC-SHA256
          schema:
            type: string
        - name: ce-type
          in: header
          description: CloudEvents event type (overrides provider-specific extraction)
          schema:
            type: string
        - name: ce-specversion
          in: header
          description: CloudEvents spec version
          schema:
            type: string
            example: "1.0"
        - name: ce-source
          in: header
          description: CloudEvents source URI
          schema:
            type: string
        - name: ce-id
          in: header
          description: CloudEvents event ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Event received or duplicate ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    description: ULID of the received event
                    example: 01JEXAMPLE00000000000000000
                  duplicate:
                    type: boolean
                    description: Whether the event was a duplicate
                    example: false
                  jobs_created:
                    type: integer
                    description: Number of jobs created for this event
                    example: 2
                required: [event_id, duplicate, jobs_created]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Signature verification failed
          content:
            text/plain:
              schema:
                type: string
                example: Invalid signature
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /events/{source}/{event_type}:
    post:
      tags: [Ingest]
      summary: Send an event
      description: |
        Sends an event to qhook with a source name. The source must be defined in
        the config as `type: event`. Multiple event sources are supported (e.g.,
        `app`, `platform`, `billing-app`, `provisioning-app`).

        If a `ce-type` header is present, it overrides the `event_type` path parameter.
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: sendEvent
      parameters:
        - name: source
          in: path
          required: true
          description: "Source name as defined in qhook configuration (must be type: event)"
          schema:
            type: string
          example: platform
        - name: event_type
          in: path
          required: true
          description: Event type identifier
          schema:
            type: string
          example: deploy.start
        - name: ce-type
          in: header
          description: CloudEvents event type (overrides path parameter)
          schema:
            type: string
        - name: ce-specversion
          in: header
          description: CloudEvents spec version
          schema:
            type: string
        - name: ce-source
          in: header
          description: CloudEvents source URI
          schema:
            type: string
        - name: ce-id
          in: header
          description: CloudEvents event ID
          schema:
            type: string
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              order_id: "ORD-123"
              customer: "cust_456"
              total: 99.99
          application/cloudevents+json:
            schema:
              type: object
              properties:
                specversion:
                  type: string
                  example: "1.0"
                type:
                  type: string
                  example: order.created
                source:
                  type: string
                data:
                  type: object
                  additionalProperties: true
              required: [specversion, type, source]
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  event_id:
                    type: string
                    description: ULID of the accepted event
                    example: 01JEXAMPLE00000000000000000
                  jobs_created:
                    type: integer
                    description: Number of jobs created for this event
                    example: 1
                required: [event_id, jobs_created]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /sns/{source}:
    post:
      tags: [Ingest]
      summary: Receive an AWS SNS message
      description: |
        Receives AWS SNS messages (Notification, SubscriptionConfirmation, UnsubscribeConfirmation).
        Subscription confirmations are auto-confirmed. Notification payloads are unwrapped
        from the SNS envelope and processed as events.

        X.509 signature verification is performed unless `skip_verify: true` is set on the source.
      security: []
      operationId: receiveSns
      parameters:
        - $ref: "#/components/parameters/source"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnsMessage"
      responses:
        "200":
          description: Message processed
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Event received
                  - Duplicate event ignored
                  - Subscription confirmed
                  - Unsubscribe acknowledged
        "400":
          description: Invalid SNS message
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Invalid UTF-8
                  - Invalid SNS message
                  - Unknown message type
                  - Invalid SubscribeURL
                  - Missing SubscribeURL
        "401":
          description: SNS signature verification failed
          content:
            text/plain:
              schema:
                type: string
                example: Invalid signature
        "404":
          $ref: "#/components/responses/SourceNotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /callback/{token}:
    post:
      tags: [Callback]
      summary: Resume a waiting workflow step
      description: |
        Resumes a workflow step that is waiting for a callback. The token is a
        cryptographic identifier generated when the callback step was created.

        The request body becomes the step output, available to subsequent steps
        via response chaining.

        Returns a uniform 404 for all failure cases (invalid, expired, or
        already-used tokens) to prevent token enumeration.
      security: []
      operationId: callback
      parameters:
        - name: token
          in: path
          required: true
          description: Callback token (52-character ULID pair)
          schema:
            type: string
            minLength: 26
          example: 01JEXAMPLETOKEN00000000000001JEXAMPLETOKEN0000000000000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              approved: true
              reviewer: "admin@example.com"
      responses:
        "200":
          description: Callback received
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: callback received
        "404":
          description: Token not found, expired, or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: not found
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: internal error
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/events/{event_id}:
    get:
      tags: [Management]
      summary: Get event details
      description: |
        Returns event details including associated jobs and workflow runs.
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: getEvent
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: event_id
          in: path
          required: true
          description: Event ID (ULID)
          schema:
            type: string
          example: 01JEXAMPLE00000000000000000
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Event ULID
                  source:
                    type: string
                    description: Source name
                  event_type:
                    type: string
                    description: Event type
                  payload:
                    type: object
                    additionalProperties: true
                    description: Event payload
                  headers:
                    type: object
                    additionalProperties:
                      type: string
                    description: Stored headers
                  unique_key:
                    type: string
                    nullable: true
                    description: Deduplication key
                  created_at:
                    type: string
                    description: Creation timestamp (UTC)
                  jobs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Associated jobs
                  workflow_runs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Associated workflow runs
                required: [id, source, event_type, payload, headers, created_at, jobs, workflow_runs]
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: event not found

  /api/jobs/{job_id}:
    get:
      tags: [Management]
      summary: Get job details
      description: |
        Returns job details including workflow data. Optionally includes delivery attempts.
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: getJob
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: job_id
          in: path
          required: true
          description: Job ID (ULID)
          schema:
            type: string
          example: 01JEXAMPLE00000000000000000
        - name: include_attempts
          in: query
          required: false
          description: Include delivery attempts in response
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Job ULID
                  event_id:
                    type: string
                    description: Associated event ULID
                  handler:
                    type: string
                    description: Handler name
                  url:
                    type: string
                    description: Delivery URL
                  status:
                    type: string
                    description: Job status
                  attempt:
                    type: integer
                    description: Current attempt number
                  max_attempts:
                    type: integer
                    description: Maximum retry attempts
                  scheduled_at:
                    type: string
                    description: Next scheduled delivery time (UTC)
                  last_error:
                    type: string
                    nullable: true
                    description: Last delivery error message
                  workflow_run_id:
                    type: string
                    nullable: true
                    description: Associated workflow run ID
                  step_name:
                    type: string
                    nullable: true
                    description: Workflow step name
                  step_index:
                    type: integer
                    nullable: true
                    description: Workflow step index
                  attempts:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Delivery attempts (only if include_attempts=true)
                required: [id, event_id, handler, url, status, attempt, max_attempts, scheduled_at]
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: job not found

  /api/events:
    get:
      tags: [Management]
      summary: List events
      description: |
        Returns a paginated list of events with optional filters.
        Does not include event payload (use GET /api/events/{event_id} for full details).
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: listEvents
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: source
          in: query
          required: false
          description: Filter by source name
          schema:
            type: string
        - name: event_type
          in: query
          required: false
          description: Filter by event type
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Filter events created at or after this ISO timestamp
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: Filter events created at or before this ISO timestamp
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return (default 50, max 1000)
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: after
          in: query
          required: false
          description: Cursor for pagination (event ID to start after)
          schema:
            type: string
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Event ULID
                        source:
                          type: string
                          description: Source name
                        event_type:
                          type: string
                          description: Event type
                        unique_key:
                          type: string
                          nullable: true
                          description: Deduplication key
                        created_at:
                          type: string
                          description: Creation timestamp (UTC)
                      required: [id, source, event_type, created_at]
                  has_more:
                    type: boolean
                    description: Whether more events exist beyond this page
                required: [events, has_more]
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token

  /api/events/{event_id}/jobs:
    get:
      tags: [Management]
      summary: List jobs for an event
      description: |
        Returns all jobs associated with a specific event.
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: listEventJobs
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: event_id
          in: path
          required: true
          description: Event ID (ULID)
          schema:
            type: string
      responses:
        "200":
          description: List of jobs for the event
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Job ULID
                        handler:
                          type: string
                          description: Handler name
                        status:
                          type: string
                          description: Job status
                        attempt:
                          type: integer
                          description: Current attempt number
                        max_attempts:
                          type: integer
                          description: Maximum retry attempts
                        scheduled_at:
                          type: string
                          description: Next scheduled delivery time (UTC)
                        last_error:
                          type: string
                          nullable: true
                          description: Last delivery error message
                        created_at:
                          type: string
                          description: Creation timestamp (UTC)
                      required: [id, handler, status, attempt, max_attempts, scheduled_at, created_at]
                required: [jobs]
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token

  /api/jobs:
    get:
      tags: [Management]
      summary: List jobs
      description: |
        Returns a paginated list of jobs with optional filters.
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: listJobs
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by job status (available, running, completed, dead)
          schema:
            type: string
            enum: [available, running, completed, dead]
        - name: handler
          in: query
          required: false
          description: Filter by handler name
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of jobs to return (default 50, max 1000)
          schema:
            type: integer
            default: 50
            maximum: 1000
        - name: after
          in: query
          required: false
          description: Cursor for pagination (job ID to start after)
          schema:
            type: string
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Job ULID
                        event_id:
                          type: string
                          description: Associated event ULID
                        handler:
                          type: string
                          description: Handler name
                        status:
                          type: string
                          description: Job status
                        attempt:
                          type: integer
                          description: Current attempt number
                        max_attempts:
                          type: integer
                          description: Maximum retry attempts
                        scheduled_at:
                          type: string
                          description: Next scheduled delivery time (UTC)
                        last_error:
                          type: string
                          nullable: true
                          description: Last delivery error message
                        created_at:
                          type: string
                          description: Creation timestamp (UTC)
                      required: [id, event_id, handler, status, attempt, max_attempts, scheduled_at, created_at]
                  has_more:
                    type: boolean
                    description: Whether more jobs exist beyond this page
                required: [jobs, has_more]
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token

  /api/jobs/{job_id}/attempts:
    get:
      tags: [Management]
      summary: List delivery attempts for a job
      description: |
        Returns all delivery attempts for a specific job.
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: listJobAttempts
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: job_id
          in: path
          required: true
          description: Job ID (ULID)
          schema:
            type: string
      responses:
        "200":
          description: List of delivery attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        attempt:
                          type: integer
                          description: Attempt number
                        status_code:
                          type: integer
                          nullable: true
                          description: HTTP status code from delivery
                        error:
                          type: string
                          nullable: true
                          description: Error message if delivery failed
                        duration_ms:
                          type: integer
                          nullable: true
                          description: Delivery duration in milliseconds
                        created_at:
                          type: string
                          description: Attempt timestamp (UTC)
                      required: [attempt, created_at]
                required: [attempts]
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token

  /api/outbound/endpoints:
    post:
      tags: [Outbound]
      summary: Create an outbound endpoint
      description: |
        Registers a new customer webhook endpoint. Returns a unique signing secret
        (`whsec_` prefix) for Standard Webhooks signature verification.
      operationId: createEndpoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Source name this endpoint receives events from
                url:
                  type: string
                  format: uri
                  description: Customer's webhook URL
                description:
                  type: string
                  description: Human-readable description
              required: [source, url]
            example:
              source: my-saas
              url: https://customer.com/webhook
              description: Customer A
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundEndpoint"
        "401":
          description: Missing or invalid Bearer token
    get:
      tags: [Outbound]
      summary: List outbound endpoints
      operationId: listEndpoints
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          description: Filter by source name
          schema:
            type: string
      responses:
        "200":
          description: List of endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboundEndpoint"

  /api/outbound/endpoints/{endpoint_id}:
    get:
      tags: [Outbound]
      summary: Get endpoint details
      operationId: getEndpoint
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/endpoint_id"
      responses:
        "200":
          description: Endpoint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundEndpoint"
        "404":
          description: Endpoint not found
    put:
      tags: [Outbound]
      summary: Update an endpoint
      operationId: updateEndpoint
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/endpoint_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                description:
                  type: string
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Endpoint updated
        "404":
          description: Endpoint not found
    delete:
      tags: [Outbound]
      summary: Delete an endpoint
      description: Deletes the endpoint and all its subscriptions.
      operationId: deleteEndpoint
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/endpoint_id"
      responses:
        "200":
          description: Endpoint deleted
        "404":
          description: Endpoint not found

  /api/outbound/endpoints/{endpoint_id}/rotate-secret:
    post:
      tags: [Outbound]
      summary: Rotate signing secret
      description: Generates a new signing secret for the endpoint. The old secret is immediately invalidated.
      operationId: rotateSecret
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/endpoint_id"
      responses:
        "200":
          description: Secret rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  signing_secret:
                    type: string
                    description: New signing secret (whsec_ prefix)
                    example: whsec_dGhpcyBpcyBhIHRlc3Q=
        "404":
          description: Endpoint not found

  /api/outbound/endpoints/{endpoint_id}/subscriptions:
    post:
      tags: [Outbound]
      summary: Subscribe to event types
      operationId: createSubscriptions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/endpoint_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_types:
                  type: array
                  items:
                    type: string
                  description: "Event types to subscribe to. Use '*' for all events."
              required: [event_types]
            example:
              event_types: [order.created, payment.completed]
      responses:
        "201":
          description: Subscriptions created
        "404":
          description: Endpoint not found
    get:
      tags: [Outbound]
      summary: List subscriptions
      operationId: listSubscriptions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/endpoint_id"
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    endpoint_id:
                      type: string
                    event_type:
                      type: string
                    created_at:
                      type: string

  /api/outbound/endpoints/{endpoint_id}/subscriptions/{subscription_id}:
    delete:
      tags: [Outbound]
      summary: Delete a subscription
      operationId: deleteSubscription
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/endpoint_id"
        - name: subscription_id
          in: path
          required: true
          description: Subscription ID (ULID)
          schema:
            type: string
      responses:
        "200":
          description: Subscription deleted
        "404":
          description: Subscription not found

  /api/queues:
    get:
      tags: [Queues]
      summary: List queues
      description: |
        Returns all configured pull-mode queues with their current depth.
        Requires Bearer token authentication if `api.auth_token` is configured.
      operationId: listQueues
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: List of queues
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Queue name
                          example: billing
                        source:
                          type: string
                          description: Source name
                          example: stripe
                        events:
                          type: array
                          items:
                            type: string
                          description: Subscribed event types (empty = all)
                          example: [invoice.paid, invoice.payment_failed]
                        visibility_timeout:
                          type: string
                          description: Visibility timeout duration
                          example: "60s"
                        depth:
                          type: integer
                          description: Number of messages currently in the queue
                          example: 42
                      required: [name, source, events, visibility_timeout, depth]
                required: [queues]
        "401":
          description: Missing or invalid Bearer token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token

  /api/queues/{name}/messages:
    get:
      tags: [Queues]
      summary: Receive messages from a queue
      description: |
        Receives messages from a pull-mode queue. Supports long-polling via the `wait`
        parameter. Received messages become invisible to other consumers for the duration
        of the queue's `visibility_timeout`.

        Returns an empty `{"messages": []}` when no messages are available after the
        wait period expires.

        Requires the queue's `api_key` as Bearer token if configured.
      operationId: receiveMessages
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: path
          required: true
          description: Queue name as defined in qhook configuration
          schema:
            type: string
          example: billing
        - name: wait
          in: query
          required: false
          description: "Long-poll duration. Max 30s. Returns immediately if messages are available."
          schema:
            type: string
            default: "0s"
          example: "10s"
        - name: batch
          in: query
          required: false
          description: "Number of messages to receive. Range: 1-100."
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 100
          example: 5
      responses:
        "200":
          description: Messages received (may be empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueueMessage"
                required: [messages]
        "401":
          description: Missing or invalid queue API key
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token
        "404":
          description: Queue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: queue not found

  /api/queues/{name}/ack:
    post:
      tags: [Queues]
      summary: Acknowledge messages
      description: |
        Acknowledges one or more messages. Acknowledged messages are permanently
        removed from the queue.

        Requires the queue's `api_key` as Bearer token if configured.
      operationId: ackMessages
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: path
          required: true
          description: Queue name
          schema:
            type: string
          example: billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Message IDs to acknowledge
              required: [ids]
            example:
              ids: ["01JEXAMPLE00000000000000000"]
      responses:
        "200":
          description: Messages acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  acked:
                    type: integer
                    description: Number of messages acknowledged
                    example: 1
                required: [acked]
        "401":
          description: Missing or invalid queue API key
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token
        "404":
          description: Queue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: queue not found

  /api/queues/{name}/nack:
    post:
      tags: [Queues]
      summary: Negative-acknowledge messages
      description: |
        Negative-acknowledges one or more messages. Nacked messages are re-queued
        for retry. If `max_attempts` is configured on the queue and the message has
        exceeded it, the message moves to the dead-letter queue instead.

        Requires the queue's `api_key` as Bearer token if configured.
      operationId: nackMessages
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: name
          in: path
          required: true
          description: Queue name
          schema:
            type: string
          example: billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Message IDs to negative-acknowledge
              required: [ids]
            example:
              ids: ["01JEXAMPLE00000000000000000"]
      responses:
        "200":
          description: Messages nacked
          content:
            application/json:
              schema:
                type: object
                properties:
                  retried:
                    type: integer
                    description: Number of messages re-queued for retry
                    example: 1
                  dead:
                    type: integer
                    description: Number of messages moved to dead-letter queue
                    example: 0
                required: [retried, dead]
        "401":
          description: Missing or invalid queue API key
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token
        "404":
          description: Queue not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: queue not found

  /health:
    get:
      tags: [Operations]
      summary: Health check
      description: Returns service health status and current queue depth.
      security: []
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  queue_depth:
                    type: integer
                    example: 42
                required: [status, queue_depth]
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  detail:
                    type: string
                    example: database unreachable
                required: [status, detail]

  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics
      description: |
        Returns metrics in Prometheus text exposition format.
        Requires Bearer token authentication if `api.metrics_auth_token` is configured.
      operationId: metrics
      security:
        - metricsAuth: []
        - {}
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP qhook_events_received_total Total events received
                # TYPE qhook_events_received_total counter
                qhook_events_received_total{source="webhooks"} 150
                # HELP qhook_queue_depth Current pending jobs
                # TYPE qhook_queue_depth gauge
                qhook_queue_depth 3
        "401":
          description: Missing or invalid metrics auth token
          content:
            text/plain:
              schema:
                type: string
                example: Invalid token
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API auth token (configured via `api.auth_token`)
    metricsAuth:
      type: http
      scheme: bearer
      description: Metrics auth token (configured via `api.metrics_auth_token`)

  parameters:
    source:
      name: source
      in: path
      required: true
      description: Source name as defined in qhook configuration
      schema:
        type: string
      example: github
    endpoint_id:
      name: endpoint_id
      in: path
      required: true
      description: Outbound endpoint ID (ULID)
      schema:
        type: string
      example: 01JEXAMPLE00000000000000000

  schemas:
    SnsMessage:
      type: object
      properties:
        Type:
          type: string
          enum:
            - Notification
            - SubscriptionConfirmation
            - UnsubscribeConfirmation
        MessageId:
          type: string
        TopicArn:
          type: string
        Subject:
          type: string
        Message:
          type: string
          description: The actual payload (JSON string for Notification)
        Timestamp:
          type: string
          format: date-time
        Signature:
          type: string
        SigningCertURL:
          type: string
          format: uri
        SignatureVersion:
          type: string
          enum: ["1", "2"]
        SubscribeURL:
          type: string
          format: uri
          description: Present only for SubscriptionConfirmation
      required: [Type, MessageId, TopicArn, Message, Timestamp]

    OutboundEndpoint:
      type: object
      properties:
        id:
          type: string
          description: Endpoint ULID
        source:
          type: string
          description: Source name
        url:
          type: string
          format: uri
          description: Customer's webhook URL
        description:
          type: string
        signing_secret:
          type: string
          description: "HMAC signing secret (whsec_ prefix, only returned on create and rotate)"
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
        updated_at:
          type: string
      required: [id, source, url, signing_secret, status, created_at, updated_at]

    QueueMessage:
      type: object
      properties:
        id:
          type: string
          description: Message ID (ULID)
          example: 01JEXAMPLE00000000000000000
        event_id:
          type: string
          description: Associated event ID (ULID)
          example: 01JEXAMPLE00000000000000001
        event_type:
          type: string
          description: Event type
          example: invoice.paid
        payload:
          type: object
          additionalProperties: true
          description: Event payload
        headers:
          type: object
          additionalProperties:
            type: string
          description: Stored headers
        attempt:
          type: integer
          description: Current delivery attempt number
          example: 1
        created_at:
          type: string
          description: Creation timestamp (UTC)
          example: "2026-03-28T12:00:00.000"
      required: [id, event_id, event_type, payload, headers, attempt, created_at]

    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain:
          schema:
            type: string
            example: Invalid UTF-8

    SourceNotFound:
      description: Source not found in configuration
      content:
        text/plain:
          schema:
            type: string
            example: Unknown source

    PayloadTooLarge:
      description: Request body exceeds size limit (default 1MB)

    RateLimited:
      description: Per-IP rate limit exceeded

    InternalError:
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
            example: Internal error

    ServiceUnavailable:
      description: Concurrency limit exceeded or service unavailable
