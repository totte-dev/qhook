replicaCount: 1

image:
  repository: ghcr.io/totte-dev/qhook
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8888

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: qhook.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# qhook configuration (inline YAML)
config:
  server:
    port: 8888
  database:
    driver: sqlite
  sources: {}
  handlers: {}

# Use an existing ConfigMap instead of inline config
existingConfigMap: ""

# Use an existing Secret for sensitive config values (e.g., database URL)
existingSecret: ""

# Extra environment variables
env: []

# Persistence for SQLite database
persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# Postgres: set database.driver=postgres and database.url via existingSecret
