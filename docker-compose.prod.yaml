# qhook - Postgres (production)
services:
  qhook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - ./examples/qhook.postgres.yaml:/data/qhook.yaml:ro
    environment:
      RUST_LOG: qhook=info
      DATABASE_URL: postgres://qhook:qhook@postgres:5432/qhook
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: qhook
      POSTGRES_PASSWORD: qhook
      POSTGRES_DB: qhook
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qhook"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
